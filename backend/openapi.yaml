openapi: 3.1.0
info:
  title: SwarpPay API
  version: 0.1.0
  description: Backend for the SwarpPay onboarding flow and Home screen.

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check that the API is running
      responses:
        "200":
          description: The API is up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
